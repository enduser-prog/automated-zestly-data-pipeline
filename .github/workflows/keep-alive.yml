name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app like a real user
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          URL = "https://automated-zestly-data-pipeline-yvhmeweq73qp9n4ufbqerg.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, timeout=60000)

              # If the app is asleep, click the wake-up button
              wake = page.get_by_text("Yes, get this app back up!")
              if wake.count():
                  print("App was asleep, waking it up")
                  wake.click()

              # Give the app time to load and open its websocket
              page.wait_for_timeout(20000)
              print("Page title:", page.title())
              browser.close()
          EOF
